[project]
name = "py-project-template"
version = "0.1.0"
description = "Scaffold a new Python / ML-research repo"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
lint = ["pytest", "ruff", "ty"]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.8.1",
    "mkdocs-static-i18n>=1.3.1",
]
dev = [
    { include-group = "lint" },
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
norecursedirs = ["ai-lorebook", "mlkit", "overlay", "overlay_mlkit", "docs", "snippets"]
